name: Integrated landing M0 evidence harness

on:
  push:
    branches:
      - design/integrated-landing-m0

permissions:
  contents: read

jobs:
  evidence-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify session identity, impulse and measured-force replay
        run: python tools/integrated_landing_evidence.py self-test
      - name: Verify TRX diagnostics and outcome comparison
        run: python tools/integrated_landing_regressions.py --self-test
