// Recovery data travels with each engine part, not the current master MechJeb.
@PART[*]:HAS[@MODULE[ModuleEngines*],!MODULE[MechJebDifferentialThrottleState]]:NEEDS[MechJeb2]:FINAL
{
    MODULE
    {
        name = MechJebDifferentialThrottleState
    }
}

// Keep constituent mode preferences even on a MechJeb-equipped craft without engines.
@PART[*]:HAS[@MODULE[MechJebCore],!MODULE[MechJebDifferentialThrottleState]]:NEEDS[MechJeb2]:FINAL
{
    MODULE
    {
        name = MechJebDifferentialThrottleState
    }
}
